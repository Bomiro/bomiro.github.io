<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f4f0">
    <meta name="description" content="A little introduction to Bomiro.">
    <title>Bomiro — Profile</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #23251f;
        background: #f5f4f0;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 32px 20px;
        place-items: center;
      }

      main {
        width: min(100%, 560px);
      }

      .profile {
        padding: clamp(32px, 8vw, 64px);
        border: 1px solid #e8e6de;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 20px 60px rgb(43 45 35 / 7%);
        text-align: center;
      }

      .avatar {
        display: grid;
        width: 88px;
        height: 88px;
        margin: 0 auto 28px;
        border-radius: 50%;
        background: #e5eddb;
        color: #3d5a37;
        font-size: 2rem;
        font-weight: 700;
        place-items: center;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #6a8060;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 8vw, 3.5rem);
        letter-spacing: -0.06em;
        line-height: 1.05;
      }

      .intro {
        max-width: 360px;
        margin: 20px auto 30px;
        color: #6b6d65;
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .link {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0 20px;
        border-radius: 999px;
        background: #344b30;
        color: #fff;
        font-size: 0.95rem;
        font-weight: 650;
        text-decoration: none;
        transition: background-color 160ms ease, transform 160ms ease;
      }

      .link:hover {
        transform: translateY(-2px);
        background: #263a23;
      }

      .link:focus-visible {
        outline: 3px solid #9ab68c;
        outline-offset: 4px;
      }

      .link svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="profile" aria-labelledby="profile-name">
        <div class="avatar" aria-hidden="true">B</div>
        <p class="eyebrow">Hello, I'm</p>
        <h1 id="profile-name">Bomiro</h1>
        <p class="intro">I build thoughtful things for the web and enjoy learning something new along the way.</p>
        <a class="link" href="https://github.com/Bomiro" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.56.1.76-.24.76-.54v-2.08c-3.1.67-3.75-1.31-3.75-1.31-.51-1.29-1.24-1.63-1.24-1.63-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15 1 .1.77 2.02 3.1 1.53.1-.72.4-1.21.72-1.49-2.48-.28-5.09-1.24-5.09-5.52 0-1.22.44-2.21 1.15-2.99-.12-.28-.5-1.42.11-2.95 0 0 .94-.3 3.05 1.14a10.6 10.6 0 0 1 5.55 0c2.11-1.44 3.05-1.14 3.05-1.14.61 1.53.23 2.67.11 2.95.72.78 1.15 1.77 1.15 2.99 0 4.29-2.62 5.23-5.11 5.51.4.35.76 1.03.76 2.08v3.08c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"/>
          </svg>
          Find me on GitHub
        </a>
      </section>
    </main>
  </body>
</html>
